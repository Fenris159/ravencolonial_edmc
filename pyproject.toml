[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ravencolonial-edmc"
version = "1.8.0"
description = "Elite Dangerous Market Connector plugin for Ravencolonial colonization tracking"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.13.9,<3.14"
dependencies = [
    "requests>=2.31.0",
]

[tool.setuptools.packages.find]
where = ["."]
