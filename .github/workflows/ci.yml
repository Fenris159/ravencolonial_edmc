# Lightweight CI: dependency install + lint + Python syntax compile (no EDMC runtime).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Python dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint (flake8)
        run: flake8 . --statistics --count

      - name: Unit tests
        run: pytest

      - name: Syntax check (compileall)
        run: python -m compileall -q .
