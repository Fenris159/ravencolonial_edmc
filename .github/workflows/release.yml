# Build the same RavenColonial_EDMC-v*.zip as `python make_release.py` (see make_release.py).
#
# - workflow_dispatch (default): build + artifact only. Version in the zip comes from
#   load.py on the branch you select when running the workflow.
# - workflow_dispatch + "Publish GitHub release" = true: same build, then `gh release
#   create` creates tag v{version} and a Release with auto-generated notes and the zip
#   (version must match load.py; fails if that release/tag already exists).
# - Push tag v*: tag must match load.py `plugin_version`. Zip is attached via softprops
#   (e.g. after `git push origin v1.6.2`). Creating the tag via publish above may also
#   trigger this run; the release action updates an existing release if needed.
name: Build release

on:
  workflow_dispatch:
    inputs:
      publish_github_release:
        description: "Create tag v{load.py version} + GitHub Release with the zip and generated notes"
        type: boolean
        default: false
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Read plugin_version from load.py
        id: plugin_ver
        run: |
          python << 'EOF'
          import os, re, pathlib

          text = pathlib.Path("load.py").read_text(encoding="utf-8")
          m = re.search(r'plugin_version\s*=\s*"([^"]+)"', text)
          if not m:
              print("::error::Could not parse plugin_version from load.py")
              raise SystemExit(1)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"value={m.group(1)}\n")
          EOF

      - name: Verify tag matches load.py plugin_version (tag builds only)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_REF: ${{ github.ref }}
        run: |
          python << 'EOF'
          import os, re, pathlib, sys

          ref = os.environ["GITHUB_REF"]
          if not ref.startswith("refs/tags/"):
              sys.exit(0)
          tag = ref.removeprefix("refs/tags/")
          text = pathlib.Path("load.py").read_text(encoding="utf-8")
          m = re.search(r'plugin_version\s*=\s*"([^"]+)"', text)
          if not m:
              print("::error::Could not parse plugin_version from load.py")
              sys.exit(1)
          pv = m.group(1)
          if tag != f"v{pv}":
              print(
                  f"::error::Git tag is {tag!r} but load.py plugin_version is {pv!r}. "
                  f"Bump load.py and plugin_config/settings.py, commit, then tag v{pv}."
              )
              sys.exit(1)
          print(f"OK: tag {tag} matches plugin_version {pv}")
          EOF

      - name: Build release zip
        run: python make_release.py

      - name: List artifact
        shell: bash
        run: ls -la build/release/

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: RavenColonial_EDMC-release-zip
          path: build/release/*.zip

      - name: Create tag and GitHub Release (manual publish)
        if: github.event_name == 'workflow_dispatch' && inputs.publish_github_release == true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          V="${{ steps.plugin_ver.outputs.value }}"
          gh release create "v${V}" "build/release/RavenColonial_EDMC-v${V}.zip" \
            --generate-notes \
            --title "RavenColonial_EDMC v${V}"

      - name: Publish GitHub Release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/release/*.zip
          generate_release_notes: true
