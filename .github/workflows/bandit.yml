name: Bandit

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
  schedule:
    - cron: '23 12 * * 3'

jobs:
  bandit:
    permissions:
      contents: read
      security-events: write
      actions: read

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install Bandit
        run: |
          python -m pip install --upgrade pip
          pip install bandit bandit-sarif-formatter

      - name: Run Bandit
        run: |
          bandit -r . \
            -x ./tests,tests,./.venv,.venv,_compare_SrvSurvey,build,dist,.eggs,htmlcov,.pytest_cache \
            -f sarif \
            -o results.sarif \
            --exit-zero

      - name: Upload SARIF artifact
        uses: actions/upload-artifact@v6
        with:
          name: results.sarif
          path: results.sarif

      - name: Upload SARIF to Code Scanning
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif
